<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <pattern id="blueprintGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#e2e8f0" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="500" rx="16" fill="#f8fafc"/>
  <rect width="800" height="500" fill="url(#blueprintGrid)"/>

  <!-- Venue Outer Wall -->
  <rect x="40" y="40" width="720" height="420" rx="12" fill="#ffffff" stroke="#0f172a" stroke-width="4"/>

  <!-- Entrance / Lobby (Bottom Center) -->
  <rect x="300" y="380" width="200" height="80" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
  <rect x="360" y="454" width="80" height="10" fill="#22c55e"/>
  <text x="400" y="420" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="700" font-size="14" fill="#0f172a" text-anchor="middle">RECEPCIÓN Y ACCESO</text>
  <text x="400" y="440" font-family="'Inter', system-ui, sans-serif" font-weight="500" font-size="11" fill="#64748b" text-anchor="middle">Check-in de Invitados &amp; Casilleros</text>

  <!-- Central Carousel (Heart of the Venue) -->
  <circle cx="400" cy="220" r="85" fill="#fdf2f8" stroke="#a43073" stroke-width="3" stroke-dasharray="6,4"/>
  <circle cx="400" cy="220" r="70" fill="#fce7f3" stroke="#f472b6" stroke-width="2"/>
  <circle cx="400" cy="220" r="16" fill="#a43073"/>
  <text x="400" y="215" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="800" font-size="15" fill="#a43073" text-anchor="middle">🎠 CARRUSEL CENTRAL</text>
  <text x="400" y="235" font-family="'Inter', system-ui, sans-serif" font-weight="600" font-size="11" fill="#831843" text-anchor="middle">Capacidad: 12 Niños a la vez</text>

  <!-- Left Zone: Indoor Playground & Trampolines -->
  <rect x="60" y="60" width="220" height="300" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="170" y="90" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="700" font-size="14" fill="#1d4ed8" text-anchor="middle">🤸 ZONA DE BRINCOLINES</text>
  <rect x="80" y="110" width="80" height="110" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="120" y="170" font-family="'Inter', system-ui, sans-serif" font-size="11" font-weight="600" fill="#1e40af" text-anchor="middle">Trampolín 1</text>
  <rect x="180" y="110" width="80" height="110" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="220" y="170" font-family="'Inter', system-ui, sans-serif" font-size="11" font-weight="600" fill="#1e40af" text-anchor="middle">Trampolín 2</text>
  <rect x="80" y="240" width="180" height="100" rx="8" fill="#fed7aa" stroke="#f97316" stroke-width="1.5"/>
  <text x="170" y="295" font-family="'Inter', system-ui, sans-serif" font-size="12" font-weight="700" fill="#c2410c" text-anchor="middle">Alberca de Pelotas Gigante</text>

  <!-- Bottom Left: Toddler Soft-Play Zone -->
  <rect x="60" y="380" width="220" height="65" rx="6" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.5"/>
  <text x="170" y="415" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="700" font-size="12" fill="#15803d" text-anchor="middle">🐛 ESTIMULACIÓN BEBÉS (0-3 AÑOS)</text>
  <text x="170" y="432" font-family="'Inter', system-ui, sans-serif" font-size="10" fill="#166534" text-anchor="middle">Túnel Oruga &amp; Bloques Suaves</text>

  <!-- Right Zone: Dining & Cake Area -->
  <rect x="520" y="60" width="220" height="260" rx="8" fill="#faf5ff" stroke="#9333ea" stroke-width="2"/>
  <text x="630" y="90" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="700" font-size="14" fill="#7e22ce" text-anchor="middle">🎂 SALÓN COMEDOR &amp; PASTEL</text>
  <!-- Tables -->
  <rect x="545" y="110" width="170" height="40" rx="6" fill="#f3e8ff" stroke="#a855f7" stroke-width="1"/>
  <text x="630" y="135" font-family="'Inter', system-ui, sans-serif" font-size="11" font-weight="600" fill="#6b21a8" text-anchor="middle">Mesa Infantil 1 (14 niños)</text>
  <rect x="545" y="165" width="170" height="40" rx="6" fill="#f3e8ff" stroke="#a855f7" stroke-width="1"/>
  <text x="630" y="190" font-family="'Inter', system-ui, sans-serif" font-size="11" font-weight="600" fill="#6b21a8" text-anchor="middle">Mesa Infantil 2 (14 niños)</text>
  <rect x="545" y="220" width="170" height="80" rx="6" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1"/>
  <text x="630" y="260" font-family="'Inter', system-ui, sans-serif" font-size="11" font-weight="700" fill="#5b21b6" text-anchor="middle">Mesa Principal de Pastel &amp; Regalos</text>

  <!-- Restrooms & Parents Lounge (Bottom Right) -->
  <rect x="520" y="340" width="105" height="105" rx="6" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <text x="572" y="390" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="700" font-size="11" fill="#334155" text-anchor="middle">SANITARIOS</text>
  <text x="572" y="408" font-family="'Inter', system-ui, sans-serif" font-size="9" fill="#64748b" text-anchor="middle">Con Cambiadores</text>

  <rect x="635" y="340" width="105" height="105" rx="6" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <text x="687" y="390" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="700" font-size="11" fill="#334155" text-anchor="middle">CAFETERÍA</text>
  <text x="687" y="408" font-family="'Inter', system-ui, sans-serif" font-size="9" fill="#64748b" text-anchor="middle">Área para Padres</text>

  <!-- Emergency Exits -->
  <rect x="38" y="200" width="6" height="40" fill="#ef4444"/>
  <text x="25" y="225" font-family="'Inter', system-ui, sans-serif" font-size="9" font-weight="700" fill="#ef4444" transform="rotate(-90 25,225)">SALIDA</text>

  <rect x="756" y="200" width="6" height="40" fill="#ef4444"/>
  <text x="772" y="225" font-family="'Inter', system-ui, sans-serif" font-size="9" font-weight="700" fill="#ef4444" transform="rotate(90 772,225)">SALIDA</text>
</svg>
