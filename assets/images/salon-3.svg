<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="diningBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fdf4ff"/>
      <stop offset="100%" stop-color="#fae8ff"/>
    </linearGradient>
    <linearGradient id="floorWood" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fed7aa"/>
      <stop offset="50%" stop-color="#ffedd5"/>
      <stop offset="100%" stop-color="#fed7aa"/>
    </linearGradient>
  </defs>

  <!-- Wall Background -->
  <rect width="600" height="230" fill="url(#diningBg)"/>

  <!-- Balloon Arch (Top Background) -->
  <g transform="translate(300, 110)">
    <!-- Arch curves -->
    <!-- Left side balloons -->
    <circle cx="-220" cy="90" r="22" fill="#f472b6"/>
    <circle cx="-200" cy="50" r="24" fill="#a78bfa"/>
    <circle cx="-170" cy="15" r="23" fill="#38bdf8"/>
    <circle cx="-130" cy="-20" r="25" fill="#fbcfe8"/>
    <circle cx="-85" cy="-50" r="26" fill="#fbbf24"/>
    <circle cx="-35" cy="-65" r="24" fill="#f472b6"/>
    <!-- Top center -->
    <circle cx="15" cy="-68" r="27" fill="#c084fc"/>
    <circle cx="65" cy="-55" r="25" fill="#38bdf8"/>
    <!-- Right side -->
    <circle cx="115" cy="-25" r="26" fill="#fbcfe8"/>
    <circle cx="160" cy="10" r="24" fill="#fbbf24"/>
    <circle cx="195" cy="45" r="25" fill="#f472b6"/>
    <circle cx="215" cy="85" r="23" fill="#a78bfa"/>
  </g>

  <!-- Giant "Happy Birthday / Feliz Cumpleaños" Banner backdrop -->
  <rect x="180" y="70" width="240" height="42" rx="10" fill="#ffffff" stroke="#f472b6" stroke-width="2"/>
  <text x="300" y="96" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="800" font-size="16" fill="#a43073" text-anchor="middle">✨ ÁREA DE CELEBRACIÓN ✨</text>

  <!-- Floor -->
  <rect y="230" width="600" height="170" fill="url(#floorWood)"/>
  <!-- Floor planks lines -->
  <line x1="0" y1="280" x2="600" y2="280" stroke="#f97316" stroke-opacity="0.2" stroke-width="2"/>
  <line x1="0" y1="330" x2="600" y2="330" stroke="#f97316" stroke-opacity="0.2" stroke-width="2"/>

  <!-- Banquet Tables & Chiavari Chairs (Front Row) -->
  <g transform="translate(100, 200)">
    <!-- Back Chairs -->
    <rect x="30" y="-20" width="20" height="30" rx="3" fill="#fbcfe8" stroke="#f472b6" stroke-width="1.5"/>
    <rect x="80" y="-20" width="20" height="30" rx="3" fill="#fbcfe8" stroke="#f472b6" stroke-width="1.5"/>
    <rect x="130" y="-20" width="20" height="30" rx="3" fill="#fbcfe8" stroke="#f472b6" stroke-width="1.5"/>
    <rect x="180" y="-20" width="20" height="30" rx="3" fill="#fbcfe8" stroke="#f472b6" stroke-width="1.5"/>
    <rect x="230" y="-20" width="20" height="30" rx="3" fill="#fbcfe8" stroke="#f472b6" stroke-width="1.5"/>
    <rect x="280" y="-20" width="20" height="30" rx="3" fill="#fbcfe8" stroke="#f472b6" stroke-width="1.5"/>
    <rect x="330" y="-20" width="20" height="30" rx="3" fill="#fbcfe8" stroke="#f472b6" stroke-width="1.5"/>

    <!-- Table Top -->
    <rect x="10" y="10" width="380" height="40" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
    <!-- Table Runner -->
    <rect x="10" y="20" width="380" height="15" fill="#f472b6" opacity="0.3"/>
    
    <!-- Table Skirt / Legs -->
    <rect x="10" y="48" width="380" height="45" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
    <path d="M 10,93 Q 30,85 50,93 Q 70,85 90,93 Q 110,85 130,93 Q 150,85 170,93 Q 190,85 210,93 Q 230,85 250,93 Q 270,85 290,93 Q 310,85 330,93 Q 350,85 370,93 Q 380,85 390,93" fill="none" stroke="#f472b6" stroke-width="2"/>

    <!-- Table Setting Items -->
    <!-- Plates -->
    <ellipse cx="60" cy="22" rx="12" ry="5" fill="#38bdf8" opacity="0.8"/>
    <ellipse cx="120" cy="22" rx="12" ry="5" fill="#fbbf24" opacity="0.8"/>
    <ellipse cx="180" cy="22" rx="12" ry="5" fill="#f472b6" opacity="0.8"/>
    <ellipse cx="240" cy="22" rx="12" ry="5" fill="#34d399" opacity="0.8"/>
    <ellipse cx="300" cy="22" rx="12" ry="5" fill="#c084fc" opacity="0.8"/>
    <ellipse cx="350" cy="22" rx="12" ry="5" fill="#fbbf24" opacity="0.8"/>

    <!-- Centerpiece Cake -->
    <rect x="185" y="-12" width="30" height="20" rx="3" fill="#fbcfe8" stroke="#ec4899" stroke-width="1.5"/>
    <rect x="190" y="-24" width="20" height="13" rx="3" fill="#fdf2f8" stroke="#ec4899" stroke-width="1.5"/>
    <!-- Candle -->
    <rect x="199" y="-32" width="2.5" height="9" fill="#38bdf8"/>
    <circle cx="200" cy="-35" r="2.5" fill="#f59e0b"/>

    <!-- Front Chairs -->
    <rect x="40" y="55" width="24" height="35" rx="3" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
    <rect x="100" y="55" width="24" height="35" rx="3" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
    <rect x="160" y="55" width="24" height="35" rx="3" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
    <rect x="220" y="55" width="24" height="35" rx="3" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
    <rect x="280" y="55" width="24" height="35" rx="3" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
    <rect x="340" y="55" width="24" height="35" rx="3" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  </g>

  <!-- Title Badge overlay at bottom -->
  <rect x="20" y="335" width="290" height="48" rx="12" fill="#0d1c2f" fill-opacity="0.8" backdrop-filter="blur(4px)"/>
  <text x="35" y="356" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="700" font-size="14" fill="#ffffff">🦄 Comedor Festivo &amp; Mesas Infantiles</text>
  <text x="35" y="372" font-family="'Inter', system-ui, sans-serif" font-weight="500" font-size="11" fill="#93c5fd">● Montaje Completo y Decoración Lista</text>
</svg>
