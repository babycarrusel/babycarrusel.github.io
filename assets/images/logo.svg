<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="100%" height="100%">
  <defs>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a43073"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffb95f"/>
      <stop offset="100%" stop-color="#de8e00"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#a43073" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Carousel Icon Badge -->
  <g transform="translate(10, 8)" filter="url(#shadow)">
    <!-- Base circle -->
    <rect width="64" height="64" rx="18" fill="url(#primaryGrad)"/>
    
    <!-- Tent canopy -->
    <path d="M12 28 Q 32 14 52 28 L 52 32 Q 32 20 12 32 Z" fill="#ffffff" opacity="0.95"/>
    <polygon points="32,14 26,28 38,28" fill="url(#goldGrad)"/>
    <circle cx="32" cy="14" r="3" fill="#ffffff"/>

    <!-- Poles -->
    <rect x="18" y="32" width="2.5" height="18" rx="1.2" fill="#ffffff" opacity="0.9"/>
    <rect x="31" y="30" width="2.5" height="20" rx="1.2" fill="#ffffff" opacity="0.9"/>
    <rect x="44" y="32" width="2.5" height="18" rx="1.2" fill="#ffffff" opacity="0.9"/>

    <!-- Carousel Horse Silhouettes / Center elements -->
    <circle cx="32" cy="40" r="4" fill="url(#goldGrad)"/>
    <circle cx="20" cy="43" r="3" fill="#ffffff" opacity="0.95"/>
    <circle cx="44" cy="43" r="3" fill="#ffffff" opacity="0.95"/>

    <!-- Base platform -->
    <ellipse cx="32" cy="51" rx="22" ry="4" fill="#ffffff" opacity="0.95"/>
    <ellipse cx="32" cy="51" rx="18" ry="2.5" fill="url(#goldGrad)"/>

    <!-- Sparkles -->
    <path d="M50 12 L51.5 15 L54.5 16.5 L51.5 18 L50 21 L48.5 18 L45.5 16.5 L48.5 15 Z" fill="#ffddb8"/>
  </g>

  <!-- Text Brand -->
  <g transform="translate(86, 20)">
    <text x="0" y="24" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="800" font-size="24" fill="#0d1c2f" letter-spacing="-0.5">Baby Carrusel</text>
    <text x="1" y="42" font-family="'Inter', system-ui, sans-serif" font-weight="600" font-size="11" fill="#a43073" letter-spacing="1.5">SALÓN DE EVENTOS INFANTILES</text>
  </g>
</svg>
