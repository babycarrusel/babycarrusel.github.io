<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd8e7"/>
      <stop offset="100%" stop-color="#cce5ff"/>
    </linearGradient>
    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fcd5b8"/>
      <stop offset="100%" stop-color="#f7be9b"/>
    </linearGradient>
    <linearGradient id="hairGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4a2e18"/>
      <stop offset="100%" stop-color="#2c1a0e"/>
    </linearGradient>
    <linearGradient id="shirtGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a43073"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>
  </defs>
  <!-- Background Circle -->
  <circle cx="50" cy="50" r="48" fill="url(#bgGrad)" stroke="#f472b6" stroke-width="2"/>
  
  <!-- Hair back -->
  <circle cx="50" cy="45" r="26" fill="url(#hairGrad)"/>
  
  <!-- Body/Shoulders -->
  <path d="M22 88 Q 50 68 78 88 A 48 48 0 0 1 22 88 Z" fill="url(#shirtGrad)"/>
  <!-- Collar -->
  <path d="M42 74 L50 82 L58 74 Z" fill="#ffffff"/>

  <!-- Neck -->
  <rect x="44" y="60" width="12" height="15" rx="4" fill="url(#skinGrad)"/>

  <!-- Head/Face -->
  <ellipse cx="50" cy="46" rx="18" ry="21" fill="url(#skinGrad)"/>

  <!-- Hair front -->
  <path d="M32 40 Q 50 20 68 40 Q 64 26 50 25 Q 36 26 32 40 Z" fill="url(#hairGrad)"/>
  <path d="M32 40 Q 30 52 35 56 Q 34 46 38 41 Z" fill="url(#hairGrad)"/>
  <path d="M68 40 Q 70 52 65 56 Q 66 46 62 41 Z" fill="url(#hairGrad)"/>

  <!-- Eyes & Smile -->
  <circle cx="43" cy="46" r="2.2" fill="#2c1a0e"/>
  <circle cx="57" cy="46" r="2.2" fill="#2c1a0e"/>
  <path d="M45 54 Q 50 58 55 54" stroke="#a43073" stroke-width="2" stroke-linecap="round" fill="none"/>
  <!-- Cheeks -->
  <circle cx="40" cy="51" r="3.5" fill="#f472b6" opacity="0.45"/>
  <circle cx="60" cy="51" r="3.5" fill="#f472b6" opacity="0.45"/>

  <!-- Star Accessory -->
  <path d="M65 30 L66.5 33 L70 34 L66.5 35 L65 38 L63.5 35 L60 34 L63.5 33 Z" fill="#ffb95f"/>
</svg>
